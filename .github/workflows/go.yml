name: Go
on: [push,pull_request]
jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go 1.19
        uses: actions/setup-go@v5
        with:
          go-version: '1.19'

      - name: Cache go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go1.19-${{ hashFiles('**/go.sum') }}

      - name: Verify go version
        run: go version

      - name: Build & Test
        run: make ci
